name: CodeQL

on:
  workflow_dispatch:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - '**/*.mrc'
      - '**/*.png'
      - '**/*.svg'

permissions:
  actions: read
  contents: read
  security-events: write
  
jobs:
  Analyze:
    runs-on: windows-2022

    strategy:
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: cpp
          build-mode: manual

      # windows-2022 already provides VS 2022, ATL and SDK 10.0.26100.0.
      # Build both architectures without the legacy solution's installer targets.
      - name: Build x86 and x64
        shell: pwsh
        run: ./build-local.ps1 -PlatformToolset v143

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
